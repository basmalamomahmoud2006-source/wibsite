<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معنا - Contact Us</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>تواصل معنا</h1>
        <nav>
            <ul>
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="about.html">من نحن</a></li>
                <li><a href="contact.html">تواصل معنا</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>املأ البيانات التاليه </h2>
        
        <form action="#" method="post">
            <!-- Text Input -->
            <div class="form-group">
                <label for="fullname">الاسم الكامل:</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>

            <!-- Email Input -->
            <div class="form-group">
                <label for="email">البريد الإلكتروني:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <!-- Phone Number Input -->
            <div class="form-group">
                <label for="phone">رقم الهاتف:</label>
                <input type="tel" id="phone" name="phone">
            </div>

            <!-- Age Input -->
            <div class="form-group">
                <label for="age">العمر:</label>
                <input type="number" id="age" name="age" min="1" max="120">
            </div>

            <!-- Date Input -->
            <div class="form-group">
                <label for="dob">تاريخ الميلاد  :</label>
                <input type="date" id="dob" name="dob">
            </div>

            <!-- Radio Buttons -->
            <div class="form-group">
                <label>الجنس:</label>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">ذكر</label>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">أنثى</label>
            </div>

            <!-- Checkboxes -->
            <div class="form-group">
                <label>الاهتمامات:</label>
                <input type="checkbox" id="web" name="interests" value="web">
                <label for="web">تطوير الويب</label>
                <input type="checkbox" id="ai" name="interests" value="ai">
                <label for="ai">الذكاء الاصطناعي</label>
            </div>

            <!-- Dropdown Menu (Select) -->
            <div class="form-group">
                <label for="subject">الموضوع:</label>
                <select id="subject" name="subject">
                    <option value="general">استفسار عام</option>
                    <option value="support">الدعم الفني</option>
                    <option value="feedback">ملاحظات وقضايا</option>
                </select>
            </div>

            <!-- Textarea -->
            <div class="form-group">
                <label for="message">الرسالة:</label>
                <textarea id="message" name="message" rows="5" placeholder="اكتب رسالتك هنا..."></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit">إرسال</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 جميع الحقوق محفوظة.</p>
    </footer>

</body>
</html>
